name: Daily Autonomous EscapeLogic Short

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Optional scenario slug (leave blank for automatic next in queue)'
        required: false
        default: ''
      upload:
        description: 'Upload directly to YouTube Shorts'
        type: boolean
        default: true
      schedule:
        description: 'Schedule for optimal viewing time (14:00 UTC)'
        type: boolean
        default: true
  # schedule:
  #   - cron: '30 8 * * *'   # Slot 1: 08:30 UTC (2:00 PM IST / 3:30 AM EST)
  #   - cron: '30 14 * * *'  # Slot 2: 14:30 UTC (8:00 PM IST / 9:30 AM EST)

permissions:
  contents: write

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg, Libass & Fonts
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ffmpeg libass-dev fonts-liberation fonts-dejavu-core fontconfig curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-dotenv pillow requests yt-dlp google-api-python-client google-auth-oauthlib faster-whisper edge-tts

      - name: Execute 100% Autonomous EscapeLogic Short & Publish
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN || secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN || secrets.YOUTUBE_REFRESH_TOKEN }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          SCENARIO_ARG=""
          if [ -n "${{ github.event.inputs.scenario }}" ]; then
            SCENARIO_ARG="--scenario ${{ github.event.inputs.scenario }}"
          fi
          python scripts/produce_escapelogic_short.py --upload --schedule $SCENARIO_ARG

      - name: Commit Published EscapeLogic History
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/published_escapelogic.json config/escapelogic_scenarios.json
          git diff-index --quiet HEAD || git commit -m "chore: record published escapelogic episode [skip ci]"
          git push
